<h2 mat-dialog-title>{{ isEditMode() ? "Update" : "Add" }} Attribute</h2>
<form [formGroup]="addEditAttributeForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required />
    </mat-form-field>
  </mat-dialog-content>
  <div mat-dialog-actions align="end">
    <button mat-button type="button" (click)="dialogRef.close()">Cancel</button>
    <button mat-button type="submit" [disabled]="addEditAttributeForm.invalid">
      {{ isEditMode() ? "Update" : "Add" }}
    </button>
  </div>
</form>
